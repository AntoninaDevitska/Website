# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Editors sign in at https://app.pagescms.org. Every save is a git commit to
# this repository; the "Deploy to GitHub Pages" workflow then rebuilds the site.
#
# Images are stored in src/assets/uploads/ and referenced as "/uploads/...";
# Astro optimizes them at build time (see src/utils/images.ts).

media:
  input: src/assets/uploads
  output: /uploads
  categories: [image]
  rename: safe

settings:
  commit:
    identity: user

content:
  - name: articles
    label: Academia (articles)
    type: collection
    path: src/content/articles
    format: yaml-frontmatter
    filename: "{fields.title}.md"
    view:
      fields: [title, date, category]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
      - name: author
        label: Authors
        type: string
        description: Leave empty to show "Antonina Devitska".
      - name: category
        label: Category
        type: string
      - name: excerpt
        label: Excerpt
        type: text
        description: Short summary for cards and search engines. Leave empty to use the start of the article.
      - name: image
        label: Cover image
        type: image
        options:
          path: src/assets/uploads/articles
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: legacy_id
        type: string
        hidden: true
      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          path: src/assets/uploads/articles

  - name: services
    label: Services & courses
    type: file
    path: src/content/services.yaml
    format: yaml
    list: true
    fields:
      - name: name
        label: Category name
        type: string
        required: true
      - name: slug
        label: URL slug
        type: string
        required: true
        description: "Page address: devitska.com/courses/<slug>. Lowercase letters, numbers and dashes. Changing it breaks existing links."
        pattern:
          regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
          message: Use lowercase letters, numbers and dashes only.
      - name: legacy_id
        type: string
        hidden: true
      - name: courses
        label: Courses
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: lessons
            label: Lessons
            type: string
            description: e.g. "10 lessons"
          - name: duration
            label: Duration
            type: string
            description: e.g. "4 weeks"
          - name: enroll_link
            label: Enroll / request link
            type: string
          - name: tags
            label: Audience tags
            type: string
            list: true
          - name: image
            label: Image
            type: image
            options:
              path: src/assets/uploads/courses

  - name: certificates
    label: Certificates
    type: file
    path: src/content/certificates.yaml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: issuer
        label: Issuer
        type: string
      - name: year
        label: Year
        type: string
      - name: image
        label: Certificate image
        type: image
        options:
          path: src/assets/uploads/certificates

  - name: projects
    label: Projects
    type: file
    path: src/content/projects.yaml
    format: yaml
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: detail
        label: Extra detail
        type: text
      - name: link_label
        label: Link text
        type: string
      - name: link_href
        label: Link URL
        type: string
      - name: image
        label: Image
        type: image
        options:
          path: src/assets/uploads/projects

  - name: project-moments
    label: Project moments (gallery)
    type: file
    path: src/content/project-moments.yaml
    format: yaml
    list: true
    fields:
      - name: image
        label: Photo
        type: image
        required: true
        options:
          path: src/assets/uploads/moments
      - name: alt
        label: Description (for screen readers)
        type: string

  - name: announcement
    label: Announcement (popup)
    type: file
    path: src/content/announcement.yaml
    format: yaml
    fields:
      - name: enabled
        label: Show on the site
        type: boolean
        default: false
        description: Turns the popup and the bottom bar on or off on every page.
      - name: end_date
        label: Hide after
        type: date
        description: Optional. The announcement disappears automatically after this day.
      - name: bar_title
        label: Bottom bar — title
        type: string
        required: true
      - name: bar_details
        label: Bottom bar — details
        type: string
        description: e.g. "10–12 July 2026 · Carpathian Mountains"
      - name: button_label
        label: Small button text
        type: string
        description: Shown in the corner when a visitor hides the bottom bar.
      - name: popup_kicker
        label: Popup — small heading
        type: string
      - name: popup_title
        label: Popup — title
        type: string
        required: true
      - name: popup_subtitle
        label: Popup — subtitle (italic)
        type: string
      - name: popup_text
        label: Popup — text
        type: text
      - name: popup_details
        label: Popup — details
        type: string
        list: true
        description: Short items such as date and place.
      - name: link_text
        label: Button text
        type: string
        default: Learn more
      - name: link_url
        label: Button link
        type: string
        description: A page on this site (e.g. /events) or a full URL.

  - name: events
    label: Events
    type: file
    path: src/content/events.yaml
    format: yaml
    fields:
      - name: intro
        label: Intro text
        type: text
        description: Shown above the event cards.
      - name: events
        label: Events
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {subtitle}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: subtitle
            label: Subtitle
            type: string
          - name: show
            label: Show on the page
            type: boolean
            default: true
          - name: status
            label: Status
            type: select
            description: Sets the colour of the label in the card's corner.
            options:
              values:
                - name: upcoming
                  label: Upcoming
                - name: past
                  label: Past
          - name: label
            label: Label text
            type: string
            description: e.g. "Upcoming · 2026" or "Online Event"
          - name: emoji
            label: Emoji
            type: string
          - name: color
            label: Card colour
            type: select
            options:
              values:
                - name: forest
                  label: Forest (dark green)
                - name: sage
                  label: Sage (light green)
          - name: description
            label: Description
            type: text
          - name: details
            label: Details
            type: string
            list: true
            description: Short items such as date and place.
          - name: button_text
            label: Button text
            type: string
            default: Learn more
          - name: button_link
            label: Button link
            type: string
            description: A page on this site (e.g. /breathe-forum-2.html) or a full URL. Leave empty to hide the button.
